<!doctype html>
<!-- Arte da prévia do link (og:image), 1200x630. Gerar com: node fonte/gerar-previa.mjs (salva public/img/compartilhar-desafio.jpg) -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Figtree"; src: url(../public/fonts/figtree-latin.woff2) format("woff2"); font-weight: 300 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #873A4A; font-family: "Figtree", sans-serif; color: #F7F3E8; position: relative; }
  .pattern { position: absolute; inset: 0; background: url(../public/img/pattern.webp) center / 232px 92px repeat; opacity: .1; }
  .texto { position: absolute; left: 72px; top: 64px; width: 560px; display: grid; gap: 22px; }
  .logo { width: 210px; height: 44px; background: #F7F3E8; -webkit-mask: url(../public/img/logo-terracota-336.webp) left center / contain no-repeat; mask: url(../public/img/logo-terracota-336.webp) left center / contain no-repeat; }
  h1 { font-size: 78px; font-weight: 500; line-height: 1.02; letter-spacing: -.025em; margin-top: 18px; }
  p { font-size: 30px; font-weight: 400; line-height: 1.3; color: #ECE0D8; max-width: 15em; }
  .selo { position: absolute; left: 72px; bottom: 56px; width: 132px; height: 132px; border-radius: 50%; background: #CA6839; display: grid; place-content: center; justify-items: center; transform: rotate(-8deg); box-shadow: 0 18px 34px -18px rgba(20, 4, 8, .8); }
  .selo span { font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
  .selo strong { font-size: 42px; font-weight: 500; letter-spacing: -.02em; line-height: 1; }
  .foto { position: absolute; border-radius: 28px; box-shadow: 0 40px 70px -30px rgba(20, 4, 8, .85); object-fit: cover; }
  .foto--atras { width: 380px; height: 380px; right: 70px; top: 40px; transform: rotate(6deg); }
  .foto--frente { width: 400px; height: 400px; right: 250px; top: 196px; transform: rotate(-4deg); }
</style>
</head>
<body>
  <div class="pattern"></div>
  <div class="texto">
    <div class="logo" role="img" aria-label="ASFIT"></div>
    <h1>Desafio do Engajamento</h1>
    <p>Posta todo dia, sobe no ranking e concorre a prêmios.</p>
  </div>
  <div class="selo"><span>Até</span><strong>11/11</strong></div>
  <img class="foto foto--atras" src="../public/img/kit-2-800.webp" alt="">
  <img class="foto foto--frente" src="../public/img/press-kit-800.webp" alt="">
</body>
</html>
